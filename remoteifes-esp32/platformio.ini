[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; The firmware has no OTA path (it is flashed over serial), so the default
; dual-app partition table wastes ~1.3 MB on an unused OTA slot and left the
; single app image at ~93% full. huge_app.csv drops the OTA slot for a single
; 3 MB app partition (keeps nvs at 0x9000, so saved Wi-Fi config is preserved)
; and still leaves ~896 KB for the LittleFS assets (currently ~5 KB).
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    crankyoldgit/IRremoteESP8266@^2.8.6
    links2004/WebSockets@^2.4.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
