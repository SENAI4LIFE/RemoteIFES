name: iOS app
on:
  push:
    branches: [main]
    paths: ['remoteifes-cordova/**', 'remoteifes-web/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['remoteifes-cordova/**', 'remoteifes-web/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: remoteifes-cordova
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-cordova/package-lock.json
      - run: npm ci
      - run: npm run prepare-ios
      - run: npm run build-ios -- --emulator
      - run: npm run test-ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ios-simulator-run
          path: remoteifes-cordova/build/ios-test-*
          retention-days: 7
