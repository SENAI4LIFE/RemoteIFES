name: Virtual lab boot probe (temporary)

on:
  push:
    branches: [virtual-lab-validacao]
    paths: [virtual-lab/diagnostico/**, .github/workflows/virtual-lab-diagnostico.yml]

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAB_HOST_DESCARTAVEL: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libslirp0 libpixman-1-0 libgcrypt20 libgtk-3-0t64 libvte-2.91-0 libx11-6
      - run: node virtual-lab/diagnostico/boot.js
