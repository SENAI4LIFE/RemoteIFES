name: CI

# Validation levels:
#   pull_request            affected subsystems, fast depth (Chromium E2E only)
#   push to main            affected subsystems, full browser/platform depth
#   workflow_dispatch       Full Validation: every subsystem at full depth on the dispatched SHA
# Changes to the CI definition, unknown paths or an undeterminable diff widen to Full Validation.
# The "CI result" job always runs and fails unless every selected job succeeded and every
# unselected job was skipped, so it is safe to use as the single required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional: fail unless the dispatched ref is exactly this commit SHA'
        type: string
        default: ''
      ios_safari:
        description: 'Also run the Safari smoke on an iOS Simulator (diagnostic; pairing is intermittent on hosted runners)'
        type: boolean
        default: false
      android_broad_matrix:
        description: 'Run the Android native smoke on APIs 24, 29, 34 and 36'
        type: boolean
        default: false

permissions:
  contents: read

# Superseded runs on the same pull request or branch are cancelled. A dispatched Full
# Validation gets its own group so a later push never cancels an explicit exact-SHA run.
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      server_os: ${{ steps.select.outputs.server_os }}
      console_os: ${{ steps.select.outputs.console_os }}
      packages_os: ${{ steps.select.outputs.packages_os }}
      e2e_matrix: ${{ steps.select.outputs.e2e_matrix }}
      cordova_os: ${{ steps.select.outputs.cordova_os }}
      safari: ${{ steps.select.outputs.safari }}
      firmware: ${{ steps.select.outputs.firmware }}
      android: ${{ steps.select.outputs.android }}
      ios: ${{ steps.select.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test the selection rules
        run: node --test .github/scripts/select-checks.test.js
      - name: Select jobs for the changed files
        id: select
        run: node .github/scripts/select-checks.js
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}

  server:
    name: Server tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.server_os != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.server_os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-server/package-lock.json
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm test
        working-directory: remoteifes-server
      - name: Server health check
        working-directory: remoteifes-server
        shell: bash
        run: |
          NODE_ENV=development PORTA=8099 REMOTEIFES_DB_PATH="$RUNNER_TEMP/ci-health.db" SENHA_ADMIN_INICIAL="ci-only-strong-password" node server.js &
          SV=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/health && break
            sleep 1
          done
          BODY=$(curl -sf http://127.0.0.1:8099/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "health check failed"; kill $SV; exit 1; }
          echo "$BODY" | grep -q '"banco":"ok"' || { echo "database unavailable"; kill $SV; exit 1; }
          kill $SV

  console:
    name: Operations Console tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.console_os != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.console_os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-server/package-lock.json
      # The Console has no npm dependencies. The server dependencies are installed because the
      # backup and restore tests reuse backupService from the checkout.
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm test
        working-directory: remoteifes-console
      - name: Resource measurement (records runner figures)
        run: node test/medicao-recursos.js
        working-directory: remoteifes-console

  packages:
    name: Console package install (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.packages_os != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.packages_os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Building uses no credential: no secret is exposed here and the manifest is unsigned on
      # purpose. Signing is a separate step with the publishing key and never runs from
      # pull request code.
      - name: Build the artifacts
        working-directory: remoteifes-console
        shell: bash
        run: node empacotar/construir.js --saida "$RUNNER_TEMP/dist"

      - name: Check declared provenance
        shell: bash
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/remoteifes-console/empacotar/conferir-proveniencia.js" "$RUNNER_TEMP/dist"

      # Installation starts from the ARTIFACT, extracted outside the source tree: that is what
      # an operator receives. Installing from the checkout would not prove the package complete.
      - name: Install the artifact outside the source tree (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # The package.json path travels in an environment variable, never inside a JavaScript
          # literal: on Windows bash yields "D:\a\RemoteIFES\..." and the literal would consume
          # the backslashes.
          VERSAO=$(CONSOLE_PKG="$GITHUB_WORKSPACE/remoteifes-console/package.json" node -p "require(process.env.CONSOLE_PKG).version")
          case "$RUNNER_OS" in
            Linux) SO=linux ;;
            macOS) SO=macos ;;
          esac
          ARCO=$(node -p "process.arch")
          mkdir -p "$RUNNER_TEMP/origem"
          tar -xzf "$RUNNER_TEMP/dist/remoteifes-console-$VERSAO-$SO-$ARCO.tar.gz" -C "$RUNNER_TEMP/origem"
          cd "$RUNNER_TEMP/origem"
          node instalacao/instalar.js \
            --escopo usuario \
            --raiz "$RUNNER_TEMP/programa" \
            --estado "$RUNNER_TEMP/estado" \
            --checkout "$GITHUB_WORKSPACE"

      - name: Install the artifact outside the source tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The version is read with ConvertFrom-Json rather than `node -p "require('<path>')"`:
          # PowerShell passes a native argument that loses the Windows backslashes.
          $versao = (Get-Content -Raw "$env:GITHUB_WORKSPACE\remoteifes-console\package.json" | ConvertFrom-Json).version
          $arco = node -p "process.arch"
          Expand-Archive -Path "$env:RUNNER_TEMP\dist\remoteifes-console-$versao-windows-$arco.zip" -DestinationPath "$env:RUNNER_TEMP\origem" -Force
          Push-Location "$env:RUNNER_TEMP\origem"
          .\instalar.ps1 -Raiz "$env:RUNNER_TEMP\programa" -Estado "$env:RUNNER_TEMP\estado" -Checkout "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { throw "installer exited with $LASTEXITCODE" }
          Pop-Location

      - name: Check the installed layout
        shell: bash
        run: |
          set -euo pipefail
          VERSAO=$(CONSOLE_PKG="$GITHUB_WORKSPACE/remoteifes-console/package.json" node -p "require(process.env.CONSOLE_PKG).version")
          RAIZ="$RUNNER_TEMP/programa"
          for exigido in console-bootstrap.js launcher-bootstrap.js estado-instalacao.json \
                         "versoes/$VERSAO/console.js" "versoes/$VERSAO/launcher.js" \
                         "versoes/$VERSAO/src/servidor.js" "versoes/$VERSAO/web/index.html" \
                         "versoes/$VERSAO/instalacao/desinstalar.js"; do
            test -e "$RAIZ/$exigido" || { echo "installation is missing $exigido"; exit 1; }
          done
          # Tests and packaging tools are not part of the installed program.
          test ! -e "$RAIZ/versoes/$VERSAO/test"
          test ! -e "$RAIZ/versoes/$VERSAO/empacotar"
          node "$GITHUB_WORKSPACE/remoteifes-console/empacotar/conferir-instalacao.js" "$RAIZ"
          test -f "$RUNNER_TEMP/estado/bootstrap-token"

      # The installed program runs with no development tool on PATH: no git, no npm, no
      # compiler. Only the Node runtime RemoteIFES already requires.
      - name: Run the installed program without development tools on PATH (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          NODE_DIR=$(dirname "$(command -v node)")
          MINIMO=$(mktemp -d)
          ln -s "$NODE_DIR/node" "$MINIMO/node"
          export CONSOLE_ESTADO_DIR="$RUNNER_TEMP/estado"
          export CONSOLE_PORTA=8399
          export CONSOLE_OCIOSIDADE_S=60

          # The Console is started THROUGH THE LAUNCHER, as the system shortcut does, not by
          # invoking the backend directly: starting the backend by hand bypasses the path
          # operators use.
          env PATH="$MINIMO" node "$RUNNER_TEMP/programa/launcher-bootstrap.js" --iniciar
          test -f "$RUNNER_TEMP/estado/endereco.json" || { echo "the launcher did not let the Console publish its identity contract"; exit 1; }
          CONSOLE_PID=$(CONTRATO="$RUNNER_TEMP/estado/endereco.json" node -e 'console.log(JSON.parse(require("fs").readFileSync(process.env.CONTRATO,"utf8")).pid)')

          # No recursive descendants: a launcher that starts launchers would accumulate processes.
          NODES=$(pgrep -c node || true)
          echo "node processes after start: $NODES"

          SAIDA=$(env PATH="$MINIMO" node "$RUNNER_TEMP/programa/launcher-bootstrap.js" --status)
          echo "$SAIDA"
          kill "$CONSOLE_PID" || true
          echo "$SAIDA" | grep -q "no ar" || { echo "the launcher did not recognize the installed Console"; exit 1; }

      - name: Run the installed program without development tools on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Only node.exe is COPIED into an isolated directory. Putting the Node installation
          # directory on PATH would bring npm.cmd along, since on Windows npm lives next to node.
          # System32 and the system PowerShell stay because the Windows adapter depends on them.
          $minimo = Join-Path $env:RUNNER_TEMP "so-node"
          New-Item -ItemType Directory -Force -Path $minimo | Out-Null
          Copy-Item (Get-Command node.exe).Source (Join-Path $minimo "node.exe") -Force
          $env:PATH = "$minimo;$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:CONSOLE_ESTADO_DIR = "$env:RUNNER_TEMP\estado"
          $env:CONSOLE_PORTA = "8399"
          $env:CONSOLE_OCIOSIDADE_S = "60"
          if (Get-Command git.exe -ErrorAction SilentlyContinue) { throw "git is still on PATH; the check would prove nothing" }
          if (Get-Command npm.cmd -ErrorAction SilentlyContinue) { throw "npm is still on PATH; the check would prove nothing" }

          # The Console is started THROUGH THE LAUNCHER, as the Start Menu shortcut does.
          $contrato = "$env:RUNNER_TEMP\estado\endereco.json"
          & node.exe "$env:RUNNER_TEMP\programa\launcher-bootstrap.js" --iniciar
          if ($LASTEXITCODE -ne 0) { throw "the installed launcher could not start the Console" }
          if (-not (Test-Path $contrato)) { throw "the launcher did not let the Console publish its identity contract" }
          $pid_ = (Get-Content -Raw $contrato | ConvertFrom-Json).pid
          Write-Host "Console running as pid $pid_"

          $saida = & node.exe "$env:RUNNER_TEMP\programa\launcher-bootstrap.js" --status | Out-String
          Write-Host $saida
          Stop-Process -Id $pid_ -Force -ErrorAction SilentlyContinue
          if ($saida -notmatch "no ar") { throw "the launcher did not recognize the installed Console" }

      # On Linux the .deb is the real installation path; installing it is the only proof the
      # package is well formed. --force-depends because the runner provides Node outside the
      # distribution's nodejs package.
      - name: Install and remove the .deb package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSAO=$(CONSOLE_PKG="$GITHUB_WORKSPACE/remoteifes-console/package.json" node -p "require(process.env.CONSOLE_PKG).version")
          sudo dpkg --force-depends -i "$RUNNER_TEMP/dist/remoteifes-console_${VERSAO}_all.deb"
          test -f /opt/remoteifes-console/console-bootstrap.js
          test -f /opt/remoteifes-console/launcher-bootstrap.js
          test -f /opt/remoteifes-console/estado-instalacao.json
          test -f "/opt/remoteifes-console/versoes/$VERSAO/console.js"
          test -f /usr/share/applications/remoteifes-console.desktop
          dpkg -L remoteifes-console | head -20
          sudo dpkg -r remoteifes-console
          test ! -e /opt/remoteifes-console/console-bootstrap.js

      - name: Uninstall and check that state survives
        shell: bash
        run: |
          set -euo pipefail
          VERSAO=$(CONSOLE_PKG="$GITHUB_WORKSPACE/remoteifes-console/package.json" node -p "require(process.env.CONSOLE_PKG).version")
          node "$RUNNER_TEMP/programa/versoes/$VERSAO/instalacao/desinstalar.js" \
            --raiz "$RUNNER_TEMP/programa" --estado "$RUNNER_TEMP/estado" --sim
          test ! -e "$RUNNER_TEMP/programa/console-bootstrap.js"
          test -f "$RUNNER_TEMP/estado/bootstrap-token"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: console-packages-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.deb
            ${{ runner.temp }}/dist/manifesto.json
            ${{ runner.temp }}/dist/proveniencia.json
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Browser E2E (${{ matrix.os }}, ${{ matrix.channel || matrix.browser }}, ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.e2e_matrix != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            remoteifes-server/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm ci
        working-directory: e2e
      # Browser binaries are keyed by the lockfile, which pins the Playwright version and
      # therefore the exact browser revisions. System channels (msedge, chrome) are preinstalled.
      - name: Cache Playwright browsers
        if: ${{ !matrix.channel }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('e2e/package-lock.json') }}
      - if: ${{ !matrix.channel && runner.os == 'Linux' }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: e2e
      - if: ${{ !matrix.channel && runner.os != 'Linux' }}
        run: npx playwright install ${{ matrix.browser }}
        working-directory: e2e
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ matrix.shards }}
        working-directory: e2e
        env:
          CI: "1"
          E2E_BROWSERS: ${{ matrix.browser }}
          E2E_BROWSER_CHANNEL: ${{ matrix.channel }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}-${{ matrix.channel || matrix.browser }}-${{ matrix.shard }}
          path: e2e/playwright-report
          retention-days: 7

  safari:
    name: Native Safari (macOS)
    needs: changes
    if: needs.changes.outputs.safari == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            remoteifes-server/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm ci
        working-directory: e2e
      - run: sudo safaridriver --enable
      - name: Safari on macOS
        run: npm run test:safari
        working-directory: e2e
      - name: Safari on the iOS Simulator
        if: ${{ inputs.ios_safari }}
        run: npm run test:safari
        working-directory: e2e
        env:
          SAFARI_PLATFORM: ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: safaridriver-diagnostics
          path: ~/Library/Logs/com.apple.dt.safaridriver
          retention-days: 7

  cordova:
    name: Cordova config (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cordova_os != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.cordova_os) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-cordova/package-lock.json
      - run: npm ci
        working-directory: remoteifes-cordova
      - run: npm run validate
        working-directory: remoteifes-cordova

  firmware:
    name: ESP32 firmware build
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            remoteifes-esp32/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('remoteifes-esp32/platformio.ini') }}
      - run: pip install platformio==6.1.19
      - run: pio run
        working-directory: remoteifes-esp32

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml
    with:
      broad_matrix: ${{ inputs.android_broad_matrix || false }}

  ios:
    name: iOS
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml

  result:
    name: CI result
    if: always()
    needs: [changes, server, console, packages, e2e, safari, cordova, firmware, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Verify every selected job passed
        run: node .github/scripts/select-checks.js --verify
        env:
          PLAN: ${{ needs.changes.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
