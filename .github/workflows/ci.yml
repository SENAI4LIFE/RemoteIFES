name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Servidor (API + banco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-server/package-lock.json
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm test
        working-directory: remoteifes-server
      - name: Health check do servidor central
        working-directory: remoteifes-server
        run: |
          NODE_ENV=development PORTA=8099 REMOTEIFES_DB_PATH="$RUNNER_TEMP/ci-health.db" SENHA_ADMIN_INICIAL="ci-only-strong-password" node server.js &
          SV=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/health && break
            sleep 1
          done
          BODY=$(curl -sf http://127.0.0.1:8099/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "health check falhou"; kill $SV; exit 1; }
          echo "$BODY" | grep -q '"banco":"ok"' || { echo "banco indisponível"; kill $SV; exit 1; }
          kill $SV

  e2e:
    name: Frontend end-to-end (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "1"
          E2E_BROWSERS: ${{ matrix.browser }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/playwright-report
          retention-days: 7

  cordova-config:
    name: Validação de configuração Cordova
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-cordova/package-lock.json
      - run: npm ci
        working-directory: remoteifes-cordova
      - run: npm run validate
        working-directory: remoteifes-cordova

  firmware:
    name: Build do firmware ESP32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
            remoteifes-esp32/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('remoteifes-esp32/platformio.ini') }}
      - run: pip install platformio==6.1.19
      - run: pio run
        working-directory: remoteifes-esp32
