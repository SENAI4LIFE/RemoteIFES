name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Servidor (API + banco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-server/package-lock.json
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm test
        working-directory: remoteifes-server
      - name: Health check do servidor central
        working-directory: remoteifes-server
        run: |
          NODE_ENV=development PORTA=8099 REMOTEIFES_DB_PATH="$RUNNER_TEMP/ci-health.db" SENHA_ADMIN_INICIAL="ci-only-strong-password" node server.js &
          SV=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/health && break
            sleep 1
          done
          BODY=$(curl -sf http://127.0.0.1:8099/health)
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true' || { echo "health check falhou"; kill $SV; exit 1; }
          echo "$BODY" | grep -q '"banco":"ok"' || { echo "banco indisponível"; kill $SV; exit 1; }
          kill $SV

  e2e:
    name: Frontend end-to-end (navegador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: npm ci
        working-directory: remoteifes-server
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  cordova-config:
    name: Validação de configuração Cordova
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-cordova/package-lock.json
      - run: npm ci
        working-directory: remoteifes-cordova
      - run: npm run validate
        working-directory: remoteifes-cordova

  firmware:
    name: Build do firmware ESP32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            remoteifes-esp32/.pio
          key: pio-${{ runner.os }}-${{ hashFiles('remoteifes-esp32/platformio.ini') }}
      - run: pip install platformio==6.1.19
      - run: pio run
        working-directory: remoteifes-esp32
