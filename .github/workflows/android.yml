name: Android APK
on:
  push:
    branches: [main]
    paths: ['remoteifes-cordova/**', 'remoteifes-web/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['remoteifes-cordova/**', 'remoteifes-web/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      broad_matrix:
        description: 'Run native smoke on APIs 24, 29, 34 and 36'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: remoteifes-cordova
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remoteifes-cordova/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '8.14.2'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator'
      - name: Install emulator runtime library on the disposable runner
        run: sudo apt-get update && sudo apt-get install -y libpulse0
      - run: npm ci
      - run: npm run doctor
      - run: npm run prepare-android && npm run build-android
      - run: |
          mkdir -p build
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk build/app-debug.apk
          npm run inspect-apk -- build/app-debug.apk debug > build/debug-inspection.txt
      - run: npm run build-android-release -- --unsigned
        env:
          REMOTEIFES_SERVER_URL: https://example.com
      - name: Sign a disposable runtime specimen (never a production release)
        run: |
          export VALIDATION_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$VALIDATION_PASSWORD"
          keytool -genkeypair -keystore "$RUNNER_TEMP/validation.jks" -storetype JKS -alias validation -storepass:env VALIDATION_PASSWORD -keypass:env VALIDATION_PASSWORD -keyalg RSA -validity 2 -dname 'CN=RemoteIFES CI validation only'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/validation.jks" --ks-pass env:VALIDATION_PASSWORD --out build/validation-release.apk platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          REMOTEIFES_SERVER_URL=https://example.com npm run inspect-apk -- build/validation-release.apk release > build/release-inspection.txt
          rm "$RUNNER_TEMP/validation.jks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-validation-apks
          path: |
            remoteifes-cordova/build/app-debug.apk
            remoteifes-cordova/build/debug-inspection.txt
            remoteifes-cordova/build/validation-release.apk
            remoteifes-cordova/build/release-inspection.txt
            remoteifes-cordova/platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.broad_matrix && '[24,29,34,36]' || '[36]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: remoteifes-cordova
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-validation-apks
          path: artifacts
      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 ANDROID_TEST_CYCLES=3 node remoteifes-cordova/test-android.js artifacts/build/validation-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: android-runtime-api-${{ matrix.api }}
          path: remoteifes-cordova/build/android-test-*
          retention-days: 7
