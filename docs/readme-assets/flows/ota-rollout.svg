<svg xmlns="http://www.w3.org/2000/svg" width="800" height="406" viewBox="0 0 800 406" role="img" aria-labelledby="t d">
<title id="t">Distribuição em etapas do firmware</title>
<desc id="d">Até 50 salas são avaliadas; um canário apto precisa terminar validado antes dos lotes de 1 a 5, padrão 2. O servidor limita a duas OTAs simultâneas, inclusive avulsas. Dispositivos offline, em configuração ou com OTA em curso são reavaliados na sua vez por até dois minutos; os não aptos ficam como não atualizados. Só validado conta como sucesso; dispositivos com capacidade de validação de boot precisam enviar a evidência. Falha, reversão, resultado indeterminado, mudança do firmware publicado ou canário não validado param novas ofertas após as tentativas em curso. Pausa e cancelamento também aguardam essas tentativas. Os pendentes não recebem oferta e os já validados não são revertidos coletivamente.</desc>
<!-- Theme-neutral: opaque cards and pills; connector #6e7781 on white and GitHub dark.
Source of truth: remoteifes-server/src/services/otaRolloutService.js; otaService.js. -->
<style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2b23; }
    .cartao { fill: #ffffff; stroke: #cfd6d1; stroke-width: 1; }
    .titulo { font-size: 13.4px; font-weight: 700; }
    .corpo { font-size: 12.3px; fill: #4d5a54; }
    .fraco { font-size: 11.3px; fill: #62706a; font-style: italic; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.6px; font-weight: 600; }
    .num { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .pilula { fill: #ffffff; stroke: #aab4ae; stroke-width: 1; }
    .lugar { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #4d5a54; }
    .linha { fill: none; stroke: #6e7781; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .seta { fill: #6e7781; }
    .rotulo { font-size: 11.5px; font-weight: 600; fill: #4d5a54; }
  </style>
<rect x="6" y="4" width="788" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="400.0" y="19" text-anchor="middle">Cada sala usa a OTA avulsa; os lotes controlam quando novas ofertas podem começar</text><!-- 1 · Seleção -->
<g><rect x="6" y="44" width="132" height="148" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M18 44 h108 a12 12 0 0 1 12 12 H6 a12 12 0 0 1 12 -12 z" fill="#1a5fb4"/><circle cx="25" cy="75" r="10" fill="#1a5fb4"/><text class="num" x="25" y="79" text-anchor="middle">1</text><text class="titulo" x="41" y="80">Seleção</text><text class="corpo" x="16" y="104">até 50 salas</text><text class="corpo" x="16" y="121">com firmware</text><text class="corpo" x="16" y="138">já publicado</text></g>
<!-- 2 · Aptidão -->
<g><rect x="170" y="44" width="132" height="148" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M182 44 h108 a12 12 0 0 1 12 12 H170 a12 12 0 0 1 12 -12 z" fill="#1c6b3c"/><circle cx="189" cy="75" r="10" fill="#1c6b3c"/><text class="num" x="189" y="79" text-anchor="middle">2</text><text class="titulo" x="205" y="80">Aptidão</text><text class="corpo" x="180" y="104">versão igual ou</text><text class="corpo" x="180" y="121">superior: não</text><text class="corpo" x="180" y="138">atualizado</text><text class="fraco" x="180" y="163">temporários:</text><text class="fraco" x="180" y="180">reavaliar na vez</text></g>
<!-- 3 · Canário -->
<g><rect x="334" y="44" width="132" height="148" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M346 44 h108 a12 12 0 0 1 12 12 H334 a12 12 0 0 1 12 -12 z" fill="#0f6b70"/><circle cx="353" cy="75" r="10" fill="#0f6b70"/><text class="num" x="353" y="79" text-anchor="middle">3</text><text class="titulo" x="369" y="80">Canário</text><text class="corpo" x="344" y="104">um ESP32 apto</text><text class="corpo" x="344" y="121">primeiro; só após</text><text class="corpo" x="344" y="138">ficar validado</text><text class="corpo" x="344" y="155">seguem os lotes</text></g>
<!-- 4 · Lotes -->
<g><rect x="498" y="44" width="132" height="148" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M510 44 h108 a12 12 0 0 1 12 12 H498 a12 12 0 0 1 12 -12 z" fill="#0f6b70"/><circle cx="517" cy="75" r="10" fill="#0f6b70"/><text class="num" x="517" y="79" text-anchor="middle">4</text><text class="titulo" x="533" y="80">Lotes</text><text class="corpo" x="508" y="104">1 a 5 por lote</text><text class="corpo" x="508" y="121">(padrão 2); um</text><text class="corpo" x="508" y="138">lote de cada vez</text><text class="fraco" x="508" y="163">limite global:</text><text class="fraco" x="508" y="180">2 OTAs ativas</text></g>
<!-- 5 · Conclusão -->
<g><rect x="662" y="44" width="132" height="148" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M674 44 h108 a12 12 0 0 1 12 12 H662 a12 12 0 0 1 12 -12 z" fill="#1c6b3c"/><circle cx="681" cy="75" r="10" fill="#1c6b3c"/><text class="num" x="681" y="79" text-anchor="middle">5</text><text class="titulo" x="697" y="80">Conclusão</text><text class="corpo" x="672" y="104">só validado</text><text class="corpo" x="672" y="121">conta como</text><text class="corpo" x="672" y="138">sucesso</text><text class="fraco" x="672" y="163">pode concluir com</text><text class="fraco" x="672" y="180">não atualizados</text></g>
<!-- Caminho adiante: aguardar cada lote. -->
<g><path class="linha" d="M140 120 H156"/><path class="seta" d="M164 120 l-9 -4.5 v9 z"/><path class="linha" d="M304 120 H320"/><path class="seta" d="M328 120 l-9 -4.5 v9 z"/><path class="linha" d="M468 120 H484"/><path class="seta" d="M492 120 l-9 -4.5 v9 z"/><path class="linha" d="M632 120 H648"/><path class="seta" d="M656 120 l-9 -4.5 v9 z"/></g><!-- Parada impede novas ofertas; tentativas iniciadas terminam. -->
<g><path class="linha" d="M400 194 V214"/><path class="seta" d="M400 222 l-4.5 -9 h9 z"/><path class="linha" d="M564 194 V214"/><path class="seta" d="M564 222 l-4.5 -9 h9 z"/><rect x="334" y="224" width="460" height="69" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/><text class="titulo" x="346" y="246">Parada automática · aguarda as OTAs já iniciadas</text><text class="corpo" x="346" y="265">falhou, revertido ou indeterminado; também se o firmware</text><text class="corpo" x="346" y="282">publicado mudar ou o canário terminar sem ser validado.</text></g><!-- Controles preservam as tentativas já iniciadas. -->
<g><rect x="6" y="224" width="296" height="69" rx="10" fill="#ffffff" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4"/><text class="titulo" x="18" y="246">Pausar · Retomar · Cancelar</text><text class="corpo" x="18" y="265">pausa e cancelamento aguardam as</text><text class="corpo" x="18" y="282">tentativas em curso; pendentes não iniciam.</text></g><!-- Espera começa na vez do dispositivo, não na seleção. -->
<g><rect x="6" y="306" width="788" height="94" rx="10" fill="#ffffff" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4"/><text class="corpo" x="18" y="327">Offline, em configuração ou com OTA em curso: até 2 min de espera a partir da sua vez; depois, não atualizado.</text><text class="corpo" x="18" y="344">Com capacidade de validação de boot, a versão reportada não basta: é preciso a evidência da tentativa.</text><text class="corpo" x="18" y="361">Ao parar, os pendentes não recebem oferta. Os já validados permanecem atualizados; não há reversão coletiva.</text><text class="corpo" x="18" y="378">“Não atualizado” significa que esta distribuição pulou o dispositivo, inclusive se ele já estava na versão alvo.</text></g></svg>
