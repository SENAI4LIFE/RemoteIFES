<svg xmlns="http://www.w3.org/2000/svg" width="800" height="433" viewBox="0 0 800 433" role="img" aria-labelledby="t d">
<title id="t">Quem pode controlar uma sala</title>
<desc id="d">Após autenticação e as verificações gerais da API, o usuário comum precisa ter a permissão pode controlar, encontrar a sala sem restrição, estar na lista de autorizados ou ser proprietário da sala, e não haver reserva ativa de outra pessoa. Se qualquer condição falhar, o servidor recusa. Administradores dispensam essas três condições. A aprovação de acesso segue para a validação do comando, valor e limites. O proprietário conta como autorizado na própria sala e também gere a lista de acessos dela; a permissão geral e a reserva de outra pessoa continuam valendo para ele.</desc>
<!-- Theme-neutral: opaque cards and pills; connector #6e7781 on white and GitHub dark.
Source of truth: remoteifes-server/src/middlewares/auth.js; routes/comandoRoutes.js; routes/salasRoutes.js; services/salasService.js. -->
<style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2b23; }
    .cartao { fill: #ffffff; stroke: #cfd6d1; stroke-width: 1; }
    .titulo { font-size: 13.4px; font-weight: 700; }
    .corpo { font-size: 12.3px; fill: #4d5a54; }
    .fraco { font-size: 11.3px; fill: #62706a; font-style: italic; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.6px; font-weight: 600; }
    .num { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .pilula { fill: #ffffff; stroke: #aab4ae; stroke-width: 1; }
    .lugar { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #4d5a54; }
    .linha { fill: none; stroke: #6e7781; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .seta { fill: #6e7781; }
    .rotulo { font-size: 11.5px; font-weight: 600; fill: #4d5a54; }
  </style>
<!-- Administradores dispensam as três restrições; outras validações continuam. -->
<g><rect x="6" y="6" width="788" height="46" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><text class="titulo" x="18" y="25">Controle manual de uma sala · usuário autenticado</text><text class="corpo" x="18" y="43">Administrador: dispensa as três verificações abaixo e segue para validar o comando.</text><path class="linha" d="M706 54 V102"/><path class="seta" d="M706 110 l-4.5 -9 h9 z"/></g><!-- Caminho do usuário comum. -->
<g><rect x="6" y="65" width="584" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="298.0" y="80" text-anchor="middle">Usuário comum: as três condições precisam ser atendidas</text></g><!-- 1 · Permissão geral -->
<g><rect x="6" y="112" width="176" height="132" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M18 112 h152 a12 12 0 0 1 12 12 H6 a12 12 0 0 1 12 -12 z" fill="#1a5fb4"/><circle cx="25" cy="143" r="10" fill="#1a5fb4"/><text class="num" x="25" y="147" text-anchor="middle">1</text><text class="titulo" x="41" y="148">Permissão geral</text><text class="corpo" x="18" y="174">“pode controlar”</text><text class="corpo" x="18" y="191">está habilitada?</text></g>
<!-- 2 · Acesso à sala -->
<g><rect x="210" y="112" width="176" height="132" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M222 112 h152 a12 12 0 0 1 12 12 H210 a12 12 0 0 1 12 -12 z" fill="#1c6b3c"/><circle cx="229" cy="143" r="10" fill="#1c6b3c"/><text class="num" x="229" y="147" text-anchor="middle">2</text><text class="titulo" x="245" y="148">Acesso à sala</text><text class="corpo" x="222" y="174">sala sem restrição</text><text class="corpo" x="222" y="191">OU usuário autorizado</text><text class="corpo" x="222" y="208">OU proprietário</text><text class="corpo" x="222" y="225">da sala?</text></g>
<!-- 3 · Reserva ativa -->
<g><rect x="414" y="112" width="176" height="132" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M426 112 h152 a12 12 0 0 1 12 12 H414 a12 12 0 0 1 12 -12 z" fill="#0f6b70"/><circle cx="433" cy="143" r="10" fill="#0f6b70"/><text class="num" x="433" y="147" text-anchor="middle">3</text><text class="titulo" x="449" y="148">Reserva ativa</text><text class="corpo" x="426" y="174">sem reserva de</text><text class="corpo" x="426" y="191">outra pessoa</text><text class="corpo" x="426" y="208">neste momento?</text></g>
<!-- 4 · Pode prosseguir -->
<g><rect x="618" y="112" width="176" height="132" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M630 112 h152 a12 12 0 0 1 12 12 H618 a12 12 0 0 1 12 -12 z" fill="#1c6b3c"/><circle cx="637" cy="143" r="10" fill="#1c6b3c"/><text class="num" x="637" y="147" text-anchor="middle">4</text><text class="titulo" x="653" y="148">Pode prosseguir</text><text class="corpo" x="630" y="174">validar o comando,</text><text class="corpo" x="630" y="191">valor e limites</text><text class="corpo" x="630" y="208">antes de aplicar</text></g>
<!-- Sim continua para a próxima condição. -->
<g><path class="linha" d="M184 177 H200"/><path class="seta" d="M208 177 l-9 -4.5 v9 z"/><rect x="178" y="138" width="36" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="196.0" y="153" text-anchor="middle">sim</text><path class="linha" d="M388 177 H404"/><path class="seta" d="M412 177 l-9 -4.5 v9 z"/><rect x="382" y="138" width="36" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="400.0" y="153" text-anchor="middle">sim</text><path class="linha" d="M592 177 H608"/><path class="seta" d="M616 177 l-9 -4.5 v9 z"/><rect x="586" y="138" width="36" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="604.0" y="153" text-anchor="middle">sim</text></g>
<!-- Não em qualquer condição recusa o comando. -->
<g><path class="linha" d="M94 246 V286"/><path class="seta" d="M94 294 l-4.5 -9 h9 z"/><rect x="74" y="254" width="40" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="94.0" y="269" text-anchor="middle">não</text><path class="linha" d="M298 246 V286"/><path class="seta" d="M298 294 l-4.5 -9 h9 z"/><rect x="278" y="254" width="40" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="298.0" y="269" text-anchor="middle">não</text><path class="linha" d="M502 246 V286"/><path class="seta" d="M502 294 l-4.5 -9 h9 z"/><rect x="482" y="254" width="40" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="502.0" y="269" text-anchor="middle">não</text><rect x="6" y="296" width="584" height="40" rx="10" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/><text class="titulo" x="298" y="321" text-anchor="middle">Comando recusado pelo servidor</text></g><!-- Propriedade: gerir os acessos da sala e controlá-la como autorizado. -->
<g><rect x="6" y="352" width="788" height="75" rx="10" fill="#fbf3d9" stroke="#8a5a06" stroke-width="1.2" stroke-dasharray="6 4"/><text class="titulo" x="18" y="374">Proprietário de sala: controla a própria sala e gere quem está na lista de autorizados dela.</text><text class="corpo" x="18" y="394">Conta como autorizado na condição 2, sem constar na lista; a permissão geral e a reserva de outra pessoa continuam valendo.</text><text class="corpo" x="18" y="411">A figura cobre autorização por usuário e sala; autenticação, manutenção e limites de requisição vêm antes.</text></g></svg>
