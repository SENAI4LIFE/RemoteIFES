<svg xmlns="http://www.w3.org/2000/svg" width="800" height="437" viewBox="0 0 800 437" role="img" aria-labelledby="t d">
<title id="t">Portal de provisionamento do ESP32</title>
<desc id="d">No Wi-Fi direto, sem SSID salvo ou host/porta válidos a placa abre o portal RemoteIFES-Setup em 192.168.4.1. Salvar dados válidos reinicia. Em operação, um clique curto abre AP + STA por dez minutos, prorrogáveis por novo clique; usa 192.168.5.1 se a STA já está em 192.168.4.x. Expirar fecha o AP; salvar reinicia. Resetar Wi-Fi apaga a rede e reinicia. Na malha, expirar também reinicia, e Resetar Wi-Fi preserva o modo: um nó não necessariamente volta ao portal. O AP usa a senha salva quando exigida, com padrão remoteifes. Segurar cinco segundos transmite o failsafe OFF se salvo, sem abrir o AP.</desc>
<!-- Theme-neutral: opaque cards and pills; connector #6e7781 on white and GitHub dark.
Source of truth: remoteifes-esp32/src/main.ino. -->
<style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2b23; }
    .cartao { fill: #ffffff; stroke: #cfd6d1; stroke-width: 1; }
    .titulo { font-size: 13.4px; font-weight: 700; }
    .corpo { font-size: 12.3px; fill: #4d5a54; }
    .fraco { font-size: 11.3px; fill: #62706a; font-style: italic; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.6px; font-weight: 600; }
    .num { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
    .pilula { fill: #ffffff; stroke: #aab4ae; stroke-width: 1; }
    .lugar { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; fill: #4d5a54; }
    .linha { fill: none; stroke: #6e7781; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .seta { fill: #6e7781; }
    .rotulo { font-size: 11.5px; font-weight: 600; fill: #4d5a54; }
  </style>
<rect x="6" y="4" width="788" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="400.0" y="19" text-anchor="middle">Wi-Fi direto: portal de configuração separado da operação</text><!-- 1 · Provisionamento -->
<g><rect x="6" y="44" width="200" height="204" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M18 44 h176 a12 12 0 0 1 12 12 H6 a12 12 0 0 1 12 -12 z" fill="#1a5fb4"/><circle cx="25" cy="75" r="10" fill="#1a5fb4"/><text class="num" x="25" y="79" text-anchor="middle">1</text><text class="titulo" x="41" y="80">Provisionamento</text><text class="corpo" x="16" y="105">sem SSID salvo ou sem</text><text class="corpo" x="16" y="122">host/porta válidos</text><rect x="16" y="144" width="180" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="106.0" y="159" text-anchor="middle">RemoteIFES-Setup</text><text class="corpo" x="16" y="192">só AP: 192.168.4.1</text><text class="corpo" x="16" y="209">salvar dados válidos</text><text class="corpo" x="16" y="226">reinicia a placa</text></g>
<!-- 2 · Operação -->
<g><rect x="300" y="44" width="200" height="204" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M312 44 h176 a12 12 0 0 1 12 12 H300 a12 12 0 0 1 12 -12 z" fill="#1c6b3c"/><circle cx="319" cy="75" r="10" fill="#1c6b3c"/><text class="num" x="319" y="79" text-anchor="middle">2</text><text class="titulo" x="335" y="80">Operação</text><text class="corpo" x="310" y="105">STA: conecta ao Wi-Fi</text><text class="corpo" x="310" y="122">e ao servidor</text><rect x="310" y="144" width="180" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="400.0" y="159" text-anchor="middle">sem portal de setup</text><text class="fraco" x="310" y="192">Wi-Fi indisponível não</text><text class="fraco" x="310" y="209">abre o portal sozinho</text></g>
<!-- 3 · AP temporário -->
<g><rect x="594" y="44" width="200" height="204" rx="10" fill="#ffffff" stroke="#cfd6d1" stroke-width="1.2"/><path d="M606 44 h176 a12 12 0 0 1 12 12 H594 a12 12 0 0 1 12 -12 z" fill="#0f6b70"/><circle cx="613" cy="75" r="10" fill="#0f6b70"/><text class="num" x="613" y="79" text-anchor="middle">3</text><text class="titulo" x="629" y="80">AP temporário</text><text class="corpo" x="604" y="105">AP + STA por 10 min</text><text class="corpo" x="604" y="122">novo clique prorroga</text><rect x="604" y="144" width="180" height="26" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="694.0" y="159" text-anchor="middle">192.168.4.1 ou .5.1</text><text class="corpo" x="604" y="192">.5.1 se o IP da STA</text><text class="corpo" x="604" y="209">já for 192.168.4.x;</text><text class="corpo" x="604" y="226">operação continua</text></g>
<!-- Transições: salvar sempre reinicia; expirar no modo direto só fecha o AP. -->
<g><path class="linha" d="M208 118 H290"/><path class="seta" d="M298 118 l-9 -4.5 v9 z"/><rect x="213" y="54" width="80" height="40" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="253.0" y="69" text-anchor="middle">salvar +</text><text class="rotulo" x="253.0" y="83" text-anchor="middle">reiniciar</text><path class="linha" d="M298 201 H216"/><path class="seta" d="M208 201 l9 -4.5 v9 z"/><rect x="210" y="211" width="86" height="40" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="253.0" y="226" text-anchor="middle">Resetar Wi-Fi</text><text class="rotulo" x="253.0" y="240" text-anchor="middle">+ reiniciar</text><path class="linha" d="M502 118 H584"/><path class="seta" d="M592 118 l-9 -4.5 v9 z"/><rect x="506" y="54" width="82" height="40" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="547.0" y="69" text-anchor="middle">clique curto</text><text class="rotulo" x="547.0" y="83" text-anchor="middle">no switch</text><path class="linha" d="M592 201 H510"/><path class="seta" d="M502 201 l9 -4.5 v9 z"/><rect x="506" y="211" width="82" height="40" rx="10" fill="#ffffff" stroke="#aab4ae" stroke-width="1.2"/><text class="rotulo" x="547.0" y="226" text-anchor="middle">expirar ou</text><text class="rotulo" x="547.0" y="240" text-anchor="middle">salvar¹</text></g><!-- Malha: não é o caminho STA acima; reset_wifi preserva a configuração mesh. -->
<g><rect x="6" y="266" width="788" height="65" rx="10" fill="#ffffff" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4"/><text class="corpo" x="18" y="285">¹ Salvar reinicia em qualquer modo. Na malha, expirar também agenda reinício.</text><text class="corpo" x="18" y="303">Malha: nó opera sem Wi-Fi de infraestrutura; gateway usa AP + STA. Resetar Wi-Fi preserva</text><text class="corpo" x="18" y="320">o modo da malha: num nó, não garante voltar ao portal. O clique curto abre o setup.</text></g><!-- Senha do AP é distinta da credencial de dispositivo. -->
<g><rect x="6" y="344" width="498" height="87" rx="10" fill="#ffffff" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 4"/><text class="titulo" x="18" y="366">Senha do AP</text><text class="corpo" x="18" y="386">aberto por padrão; ao exigir senha, usa a salva na placa</text><text class="corpo" x="18" y="403">(padrão do firmware: remoteifes). Não é a credencial</text><text class="corpo" x="18" y="420">do dispositivo usada para autenticar no servidor.</text></g><!-- Pressão longa consome o gesto e tenta transmitir o failsafe salvo. -->
<g><rect x="524" y="344" width="270" height="87" rx="10" fill="#fbf3d9" stroke="#8a5a06" stroke-width="1.2" stroke-dasharray="6 4"/><text class="titulo" x="536" y="366">Manter o switch 5 s</text><text class="corpo" x="536" y="386">transmite o failsafe OFF, se salvo,</text><text class="corpo" x="536" y="403">sem depender do servidor;</text><text class="corpo" x="536" y="420">esse gesto não abre o AP.</text></g></svg>
